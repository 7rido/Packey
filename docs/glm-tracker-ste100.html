<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM-Tracker — ASD-STE100 Description</title>
<style>
  :root {
    --bg: #12151a; --panel: #1b2028; --line: #2b323d; --text: #dbe3ee;
    --dim: #8fa0b3; --accent: #4da3ff; --green: #43c67c; --orange: #f0a04b;
    --red: #e5695e; --blue: #5aa7e8; --purple: #9b7ee0; --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h1 .dim { font-weight: 400; }
  h2 { font-size: 17px; margin: 34px 0 8px; color: var(--accent);
       border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  h3 { font-size: 15px; margin: 20px 0 6px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 16px 18px; margin: 12px 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  ul { margin: 8px 0 8px 20px; padding: 0; }
  li { margin: 5px 0; }
  code, .mono { font-family: var(--mono); font-size: 13px; color: #cfe3ff;
                background: #10141a; border: 1px solid var(--line);
                border-radius: 4px; padding: 1px 5px; }
  .ste { color: var(--green); font-size: 12.5px; }
  .note { color: var(--dim); font-size: 13px; }
  .diagram { background: var(--panel); border: 1px solid var(--line);
             border-radius: 10px; padding: 10px; overflow-x: auto; }
  .diagram svg { min-width: 940px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13px; }
  .legend .k { display: inline-block; width: 12px; height: 12px;
               border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #141920; color: var(--accent); font-weight: 600; }
  td code { white-space: nowrap; }
  .pill { display: inline-block; border-radius: 10px; padding: 0 8px;
          font-size: 12px; border: 1px solid var(--line); }
  .p-g { color: var(--green); } .p-o { color: var(--orange); }
  .p-r { color: var(--red); } .p-b { color: var(--blue); } .p-v { color: var(--purple); }
</style>
</head>
<body>
<div class="wrap">
<h1>GLM-Tracker <span class="dim">— a system description in ASD-STE100 Simplified Technical English</span></h1>
<p class="sub">Writing rule: use short sentences. Use the active voice. Use one idea per sentence. Do not use rare words. This page obeys those rules.</p>

</div>
</body>
</html>
